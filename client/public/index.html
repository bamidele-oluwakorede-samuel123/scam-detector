<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Primary SEO -->
    <title>ScamShield — AI Scam Detector | Detect Scams Instantly</title>
    <meta name="description" content="ScamShield uses AI to detect scams in links, phone numbers, emails, messages, and screenshots. Free, instant, and accurate scam detection for everyone." />
    <meta name="keywords" content="scam detector, phishing detector, fake link checker, scam checker, AI scam detection, fraud detection" />
    <meta name="author" content="ScamShield" />
    <link rel="canonical" href="https://scamshield.app/" />

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn previews) -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://scamshield.app/" />
    <meta property="og:title"       content="ScamShield — AI Scam Detector" />
    <meta property="og:description" content="Paste any suspicious link, message, phone number, or screenshot and our AI will tell you if it is a scam instantly and for free." />
    <meta property="og:image"       content="https://scamshield.app/icon-512.png" />
    <meta property="og:site_name"   content="ScamShield" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="ScamShield — AI Scam Detector" />
    <meta name="twitter:description" content="Detect scams in links, messages, phone numbers, and screenshots using AI. Free and instant." />
    <meta name="twitter:image"       content="https://scamshield.app/icon-512.png" />

    <!-- PWA -->
    <meta name="theme-color" content="#63dcaa" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ScamShield" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet" />

    <!-- Structured Data for Google Rich Results -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "ScamShield",
      "url": "https://scamshield.app",
      "description": "AI-powered scam detection for links, phone numbers, emails, messages, and screenshots",
      "applicationCategory": "SecurityApplication",
      "operatingSystem": "Any",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "creator": { "@type": "Organization", "name": "ScamShield" }
    }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- Service Worker Registration -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/service-worker.js")
            .then((reg) => console.log("[PWA] Registered:", reg.scope))
            .catch((err) => console.log("[PWA] Failed:", err));
        });
      }
    </script>
  </body>
</html>
